# xcodegen spec for the Nihongo Ride Xcode App wrapper.
#
# This is consumed by `xcodegen generate` to (re)create NihongoRide.xcodeproj
# at the repo root. The Xcode project lets us build a signed .app for the
# Mac App Store (or notarized DMG) without committing the generated .xcodeproj.
#
# The Xcode App target shares its Sources/NihongoRideApp/* source files with
# the SwiftPM executable target of the same name (used for `swift run`
# development). The SPM-only Bundle.module Dock-icon hack is guarded by
# `#if SWIFT_PACKAGE`; the Xcode app gets its icon from Assets.xcassets.
#
# Usage:
#   brew install xcodegen
#   xcodegen generate          # writes NihongoRide.xcodeproj
#   open NihongoRide.xcodeproj # then Product → Archive
name: NihongoRide

options:
  bundleIdPrefix: com.jasonye
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  # Reference the local SwiftPM package at the repo root, which provides our
  # logic libraries (RomajiKana, VocabKit, ReviewKit, GameCore).
  Nihongo:
    path: .

targets:
  NihongoRide:
    type: application
    platform: macOS

    sources:
      - path: Sources/NihongoRideApp
        # Drop the SPM-only Dock-icon resource — Xcode uses Assets.xcassets.
        excludes:
          - "Resources"
      - path: xcode/Assets.xcassets
      # Info.plist and entitlements are referenced via build settings below,
      # but they also need to live somewhere xcodegen can see.
      - path: xcode/Info.plist
        buildPhase: none
      - path: xcode/NihongoRide.entitlements
        buildPhase: none

    info:
      path: xcode/Info.plist
      properties:
        CFBundleDisplayName: Nihongo Ride
        CFBundleName: Nihongo Ride
        # xcodegen writes literal defaults (1.0/1) when these are omitted —
        # reference the build settings so version bumps in project.yml stick.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Jason. All rights reserved."
        NSPrincipalClass: NSApplication
        NSMainNibFile: ""
        # No encryption beyond Apple's exempt OS-level TLS — declare it so
        # App Store Connect skips the export-compliance question on every
        # upload. The app is fully offline anyway.
        ITSAppUsesNonExemptEncryption: false

    entitlements:
      path: xcode/NihongoRide.entitlements
      properties:
        # App Sandbox (required for the Mac App Store). CloudKit works inside it.
        com.apple.security.app-sandbox: true
        com.apple.developer.game-center: true
        # v1.4: iCloud sync (private CloudKit, manual-mode CKSyncEngine — no
        # aps-environment). Container created + assigned to the App ID.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jasonye.nihongoride
        com.apple.developer.icloud-services:
          - CloudKit
        # v1.11: App Group so the widget extension can read the app's derived snapshot.
        # macOS REQUIRES the team-id prefix on the group id; iOS must NOT have it. Must
        # match WidgetSharedKit.AppGroup.identifier's platform-conditional value.
        com.apple.security.application-groups:
          - KHMK6Q3L3K.group.com.jasonye.nihongoride

    dependencies:
      - package: Nihongo
        product: RomajiKana
      - package: Nihongo
        product: VocabKit
      - package: Nihongo
        product: ReviewKit
      - package: Nihongo
        product: GameCore
      - package: Nihongo
        product: JournalKit
      - package: Nihongo
        product: SettingsKit
      - package: Nihongo
        product: StoreReviewKit
      - package: Nihongo
        product: SyncKit
      - package: Nihongo
        product: NotificationKit
      - package: Nihongo
        product: SavedWordsKit
      - package: Nihongo
        product: WordListsKit
      - package: Nihongo
        product: ConjugationReviewKit
      - package: Nihongo
        product: SpeechKit
      - package: Nihongo
        product: WidgetSharedKit
      - package: Nihongo
        product: SceneryKit
      - package: Nihongo
        product: PersistKit
      - package: Nihongo
        product: DiagnosticsKit
      # v1.11: embed the widget extension into the app (xcodegen auto-embeds
      # app-extension target deps into the host).
      - target: NihongoRideWidget

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonye.nihongoride
        PRODUCT_NAME: Nihongo Ride
        MARKETING_VERSION: "1.27"
        CURRENT_PROJECT_VERSION: "49"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM in Xcode's "Signing & Capabilities" tab.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # Don't auto-define SWIFT_PACKAGE here — Xcode only defines it for SPM
        # source compilation, and we WANT it undefined for the App target.

  # iOS app — same shared SwiftUI sources, platform-conditional input/sound/entry.
  # Same bundle ID so it lives under the one App Store Connect record (universal).
  NihongoRideiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/NihongoRideApp
        excludes:
          - "Resources"
      - path: xcode/Assets.xcassets
      - path: xcode/Info-iOS.plist
        buildPhase: none
      - path: xcode/NihongoRide-iOS.entitlements
        buildPhase: none
    entitlements:
      path: xcode/NihongoRide-iOS.entitlements
      properties:
        com.apple.developer.game-center: true
        # v1.4: iCloud sync — same CloudKit container as macOS.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jasonye.nihongoride
        com.apple.developer.icloud-services:
          - CloudKit
        # v1.11: App Group (iOS — NO team-id prefix, unlike macOS above).
        com.apple.security.application-groups:
          - group.com.jasonye.nihongoride
    info:
      path: xcode/Info-iOS.plist
      properties:
        CFBundleDisplayName: Nihongo Ride
        CFBundleName: Nihongo Ride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        # The results screen's ShareLink hands iOS a PNG, and the share sheet ALWAYS
        # offers "Save Image" for one. Choosing it without this key is not a denial —
        # the system terminates the app. We never touch the photo library ourselves;
        # this exists purely so that one share-sheet action can't crash us. (v1.10 §C)
        NSPhotoLibraryAddUsageDescription: >-
          Save your ride card to Photos when you choose "Save Image" from the share sheet.
        UILaunchScreen: {}
        # iPhone: portrait only — the game is played against the software
        # keyboard, and landscape leaves no usable screen above it. Orientation
        # limits are still honored on iPhone; the iPad rule below is different.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad: all orientations. iPadOS 26 ignores landscape-only declarations
        # (UIRequiresFullScreen is deprecated), so the app must genuinely
        # support portrait — and it does; layouts are flexible.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    dependencies:
      - package: Nihongo
        product: RomajiKana
      - package: Nihongo
        product: VocabKit
      - package: Nihongo
        product: ReviewKit
      - package: Nihongo
        product: GameCore
      - package: Nihongo
        product: JournalKit
      - package: Nihongo
        product: SettingsKit
      - package: Nihongo
        product: StoreReviewKit
      - package: Nihongo
        product: SyncKit
      - package: Nihongo
        product: NotificationKit
      - package: Nihongo
        product: SavedWordsKit
      - package: Nihongo
        product: WordListsKit
      - package: Nihongo
        product: ConjugationReviewKit
      - package: Nihongo
        product: SpeechKit
      - package: Nihongo
        product: WidgetSharedKit
      - package: Nihongo
        product: SceneryKit
      - package: Nihongo
        product: PersistKit
      - package: Nihongo
        product: DiagnosticsKit
      # v1.11: embed the iOS widget extension.
      - target: NihongoRideWidgetiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonye.nihongoride
        PRODUCT_NAME: Nihongo Ride
        MARKETING_VERSION: "1.27"
        CURRENT_PROJECT_VERSION: "50"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # iPhone + iPad. iPhone runs portrait-only with narrow layout variants
        # (isPhoneIdiom); iPad keeps the 4:3 landscape-first design.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # v1.11 widget extensions. Two targets (WidgetKit extensions are per-platform),
  # ONE shared source dir (Sources/NihongoRideWidget). Each embeds into its host app
  # and reads the app's derived snapshot from the App Group — read-only, no store deps.
  #
  # 🔴 Version MUST match the host app (App Store rejects a mismatched extension
  # version): macOS widget == macOS app (1.10/14), iOS widget == iOS app (1.10/15).
  # Phase S bumps all FOUR in lockstep.
  NihongoRideWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/NihongoRideWidget
    info:
      path: xcode/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Nihongo Ride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: xcode/NihongoRideWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - KHMK6Q3L3K.group.com.jasonye.nihongoride
    dependencies:
      - package: Nihongo
        product: WidgetSharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonye.nihongoride.widget
        PRODUCT_NAME: NihongoRideWidget
        MARKETING_VERSION: "1.27"
        CURRENT_PROJECT_VERSION: "49"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  NihongoRideWidgetiOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NihongoRideWidget
    info:
      path: xcode/WidgetInfo-iOS.plist
      properties:
        CFBundleDisplayName: Nihongo Ride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: xcode/NihongoRideWidget-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jasonye.nihongoride
    dependencies:
      - package: Nihongo
        product: WidgetSharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonye.nihongoride.widget
        PRODUCT_NAME: NihongoRideWidget
        MARKETING_VERSION: "1.27"
        CURRENT_PROJECT_VERSION: "50"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # XCUITest bundle reproducing the App Review touch-only flow on the iPad
  # simulator (keyboard appears, typing works, pause/exit by touch).
  NihongoRideiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NihongoRideiOSUITests
    dependencies:
      - target: NihongoRideiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonye.nihongoride.uitests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: NihongoRideiOS
        # Newer Xcode refuses to code-sign a test bundle with no Info.plist rather than
        # synthesising one, so the target has to ask for it explicitly. Nothing here changed
        # since v1.1 — the toolchain did.
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  NihongoRide:
    build:
      targets:
        NihongoRide: all
    run:
      config: Debug
    archive:
      config: Release
  NihongoRideiOS:
    build:
      targets:
        NihongoRideiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NihongoRideiOSUITests
    archive:
      config: Release
